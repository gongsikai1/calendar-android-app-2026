plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.calendar2026'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.calendar2026"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 纯原生实现，无任何第三方依赖，安装包极小
dependencies {
}
